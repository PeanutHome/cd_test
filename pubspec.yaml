name: cd_test
description: Offline-first Movie Explorer using TMDB API.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  retrofit_generator: ^10.2.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - .env
